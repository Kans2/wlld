version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: memed-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=memedtracker

  redis:
    image: redis:7.2-alpine
    container_name: memed-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memed-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/memedtracker
      - JWT_SECRET=production_secret_change_in_real_env_xyz123
      - JWT_EXPIRES_IN=7d
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memed-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
